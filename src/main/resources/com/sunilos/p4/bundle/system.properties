#Database Connection Parameters (Override via ORS_DB_URL, ORS_DB_USER, ORS_DB_PASSWORD env vars)
url=jdbc:mysql://localhost:3306/p04
driver=com.mysql.cj.jdbc.Driver
username=${ORS_DB_USER:root}
password=${ORS_DB_PASSWORD:}
DATABASE=JDBC
service=javaBean
acquireIncrement=1
initialPoolSize=1
maxPoolSize=5
minPoolSize=1
timeout=10

#Email Server Parameters (Override via ORS_SMTP_USER, ORS_SMTP_PASSWORD env vars)
smtp.server=smtp.gmail.com
smtp.port=587
email.login=${ORS_SMTP_USER:noreply@ors.example.com}
email.pwd=${ORS_SMTP_PASSWORD:}
checkinterval=

#Pagination, Session & SLA Performance Thresholds (SE Exp 2 Constraints 1, 2, 3)
page.size=10
session.timeout.minutes=10
sla.search.ms=3000
sla.save.ms=2000
sla.nav.ms=1500

